<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackout Protocol</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE terse field manual, everyday tool you trust in the dark
   IDEA a civil-defence field manual crossed with a hazard placard
   PICTURE readiness dial on Status; the grid-down clock takes over when the power is out
   COLOUR black ground, hazard yellow leads, alarm red for danger, green for secured
   TYPE Black Ops One stencil for titles + Barlow / Barlow Condensed
   LAYOUT one-screen app: header, scrolling view, bottom tab bar; single column up to 720px */
:root{color-scheme:dark;--bg:#0c0c0b;--p:#161614;--p2:#201f1c;--ln:#2e2d29;--ink:#f1efe6;--dim:#a8a59a;--y:#ffd400;--r:#ff4136;--g:#3ddc84}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
header{background:#000;padding:12px 16px 0}
.hd{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.logo{width:38px;height:38px;flex:none;border-radius:50%;background:var(--y);display:grid;place-items:center}
.logo svg{width:32px;height:32px}
h1{font:400 23px/1.05 'Black Ops One',Impact,sans-serif;margin:0;color:var(--y)}
.sub{font:600 15px/1.3 'Barlow Condensed',Barlow,sans-serif;color:var(--dim)}
.sub b{color:var(--r)}
.stripe{height:8px;margin:12px -16px 0;background:repeating-linear-gradient(-45deg,var(--y) 0 12px,#000 12px 24px)}
main{overflow-y:auto;overscroll-behavior:contain}
.v{max-width:720px;margin:0 auto;padding:16px 16px 32px}
nav{background:#000;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;color:var(--dim);font:600 14px/1 'Barlow Condensed',sans-serif;min-height:58px;cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--y)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:400 21px/1.1 'Black Ops One',Impact,sans-serif;margin:0 0 10px}
h3{font:700 19px/1.2 'Barlow Condensed',sans-serif;margin:0}
p{margin:0 0 10px}
.dim{color:var(--dim)}
.sm{font-size:14px}
.gauge{display:grid;justify-items:center;text-align:center}
.gauge svg{width:min(100%,340px);height:auto;display:block}
.bars{display:grid;gap:9px;margin-top:16px}
.bar{display:grid;grid-template-columns:8.6em minmax(0,1fr) 3em;align-items:center;gap:10px;font:600 15px/1.2 'Barlow Condensed',sans-serif}
.bar span:last-child{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.trk{display:block;height:10px;background:var(--p2);border-radius:6px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:6px;transition:width .4s}
.trk.thin{height:4px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:10px 16px;border-radius:12px;border:2px solid var(--y);background:var(--y);color:#000;font:700 18px/1.1 'Barlow Condensed',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--y)}
.btn.red{background:var(--r);border-color:var(--r);color:#fff}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.alarm{border-color:var(--r);background:linear-gradient(#2b0d0b,#150807)}
.alarm h2{color:var(--r)}
.clock{font:400 clamp(36px,11vw,56px)/1 'Black Ops One',Impact,sans-serif;color:var(--r);font-variant-numeric:tabular-nums;margin:4px 0 6px;white-space:nowrap}
.fc{display:grid;gap:12px;margin:10px 0 16px}
.fc .trk{height:12px}
.fr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:15px;margin-bottom:5px}
.fr span{color:var(--dim)}
.wl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:6px}
.big2{font:400 30px/1.1 'Black Ops One',Impact,sans-serif;color:var(--y);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
.kpis div{display:grid;align-content:start}
.kpis .dim{font-size:14px;line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.li{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 2px;background:none;border:0;border-top:1px solid var(--ln);text-align:left;cursor:pointer}
.box{flex:none;width:28px;height:28px;border:2px solid #6d6a60;border-radius:7px;display:grid;place-items:center;margin-top:-1px}
.li.on .box{background:var(--g);border-color:var(--g)}
.box::after{content:"";width:12px;height:7px;border:3px solid #000;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg) scale(.2);opacity:0;transition:transform .3s var(--ease),opacity .2s}
.li.on .box::after{transform:translateY(-2px) rotate(-45deg) scale(1);opacity:1}
.tx{display:grid;gap:2px;flex:1}
.nm{font-weight:600}
.nm>span{background:linear-gradient(currentColor,currentColor) left 55%/0 2px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .35s var(--ease),color .3s}
.li.on .nm{color:var(--dim)}
.li.on .nm>span{background-size:100% 2px}
.nt{font-size:14px;color:var(--dim);line-height:1.35}
.crit{justify-self:start;font:700 13px/1 'Barlow Condensed',sans-serif;color:var(--r);border:1px solid var(--r);border-radius:999px;padding:3px 7px;margin-top:2px}
.li.on .crit{display:none}
.q{flex:none;font:700 15px/1.2 'Barlow Condensed',sans-serif;background:var(--p2);border:1px solid var(--ln);border-radius:999px;padding:4px 10px;white-space:nowrap;max-width:7.5em;overflow:hidden;text-overflow:ellipsis}
.ch{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:2px 0;min-height:44px;text-align:left;cursor:pointer}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.cn{margin-left:auto;font:700 16px 'Barlow Condensed',sans-serif;color:var(--dim);white-space:nowrap}
.chev{width:22px;height:22px;flex:none;fill:none;stroke:var(--dim);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.open .chev{transform:rotate(90deg)}
.acc .chev{margin-left:auto}
.acc .ch>span{display:grid;gap:2px}
.kc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:14px;align-items:center}
input[type=search],input[type=number],input[type=text],input[type=datetime-local],textarea{width:100%;font-size:16px;background:#080807;border:1.5px solid #3a3934;border-radius:10px;padding:11px 12px;min-height:48px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
label{display:block;font:700 16px/1.2 'Barlow Condensed',sans-serif;margin:14px 0 6px}
.seg{display:inline-flex;border:1.5px solid #3a3934;border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:10px 14px;min-height:46px;font:700 16px 'Barlow Condensed',sans-serif;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--y);color:#000}
.seg.full{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin-bottom:14px}
.gb{margin-top:12px;border-top:1px solid var(--ln);padding-top:12px}
.gb ol,.gb ul{margin:0 0 10px;padding-left:22px}
.gb li{margin:7px 0}
.gb h3{margin:14px 0 6px;color:var(--y)}
.warn{border-left:4px solid var(--r);background:#260d0b;padding:10px 12px;border-radius:8px;margin:0 0 12px}
.cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cg label{margin-top:0;min-height:2.4em;display:flex;align-items:flex-end}
.stp{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;border:1.5px solid #3a3934;border-radius:10px;overflow:hidden;min-height:48px}
.stp button{background:var(--p2);border:0;font:700 22px 'Barlow Condensed',sans-serif;cursor:pointer;color:var(--y)}
.stp span{display:grid;place-items:center;font:700 20px 'Barlow Condensed',sans-serif}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mdir{font:700 14px 'Barlow Condensed',sans-serif;color:var(--y);margin-top:12px}
.mres{font:700 22px/1.45 'Barlow Condensed',sans-serif;letter-spacing:.05em;overflow-wrap:anywhere;background:#080807;border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0 12px;min-height:58px}
.mchart{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4em,1fr));gap:6px}
.mc{background:var(--p2);border-radius:8px;padding:7px 9px;display:flex;justify-content:space-between;gap:6px;font:700 17px/1 'Barlow Condensed',sans-serif}
.mc span{color:var(--y);letter-spacing:.08em}
.mc.sos{outline:2px solid var(--r)}
.tmd{font:400 clamp(44px,14vw,68px)/1 'Black Ops One',Impact,sans-serif;text-align:center;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.tmd.done{color:var(--r)}
.num{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.num:first-of-type{border-top:0}
.num a{color:var(--y);font:700 21px 'Barlow Condensed',sans-serif;white-space:nowrap;text-decoration:none}
.foot{text-align:center;margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6em,1fr));gap:8px;margin-bottom:14px}
.chips button{background:var(--p);border:1.5px solid #3a3934;border-radius:10px;min-height:46px;padding:8px 10px;font:700 16px/1.1 'Barlow Condensed',sans-serif;color:var(--dim);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#000}
.tag{font:700 13px/1 'Barlow Condensed',sans-serif;color:var(--y)}
.freq{font:400 20px/1 'Black Ops One',Impact,sans-serif;color:var(--y);white-space:nowrap}
.meter{position:relative;height:14px;background:var(--p2);border-radius:7px;margin:14px 0 0;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;width:0;transition:width .05s}
.meter b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--r);border-radius:2px}
input[type=range]{width:100%;accent-color:var(--y);height:40px}
.cg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cg2 label{margin-top:12px}
select{width:100%;font-size:16px;background:#080807;border:1.5px solid #3a3934;border-radius:10px;padding:11px 12px;min-height:48px;color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;font:600 16px Barlow,sans-serif}
.chk input{width:24px;height:24px;accent-color:var(--y)}
.co{display:grid;gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.btn.pre{display:grid;gap:2px;justify-items:center;font-size:16px;padding:8px}
.btn.pre small{font:600 13px 'Barlow Condensed',sans-serif;opacity:.8}
.trow{padding:12px 0;border-top:1px solid var(--ln)}
.trow:first-child{border-top:0}
.trow.done .tv{color:var(--r)}
.th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tv{font:400 clamp(34px,10vw,48px)/1.1 'Black Ops One',Impact,sans-serif;font-variant-numeric:tabular-nums;margin:4px 0 8px;white-space:nowrap}
.tbtn{display:flex;flex-wrap:wrap;gap:8px}
.tbtn .btn{min-height:44px;padding:8px 14px;font-size:16px}
.le{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.le:first-child{border-top:0}
.lt{font:700 14px 'Barlow Condensed',sans-serif;color:var(--y);white-space:nowrap}
.lxb{background:none;border:1px solid var(--ln);border-radius:8px;color:var(--dim);width:40px;height:40px;cursor:pointer;flex:none}
.le.em .lx{color:var(--r);font-weight:700}
.le .lt{line-height:1.25}
#testbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--r);color:#fff;margin:0 -16px;padding:8px 16px;font:600 15px/1.3 'Barlow Condensed',sans-serif}
#testbar[hidden]{display:none}
#testbar button{background:#fff;color:#000;border:0;border-radius:8px;min-height:40px;padding:6px 12px;font:700 15px 'Barlow Condensed',sans-serif;cursor:pointer;flex:none}
.hd #modep{flex:none;border:2px solid var(--y);background:transparent;color:var(--y);border-radius:999px;min-height:40px;padding:6px 14px;font:700 15px 'Barlow Condensed',sans-serif;cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
body.lock #modep{background:var(--r);border-color:var(--r);color:#fff;animation:glow 2.6s ease-in-out infinite}
body.lock header{background:#180504}
body.lock .stripe{background:repeating-linear-gradient(-45deg,var(--r) 0 12px,#000 12px 24px)}
body.lock #ind{background:var(--r);box-shadow:0 0 14px var(--r)}
body.lock nav button[aria-current=page]{color:var(--r)}
body.lock .logo{background:var(--r)}
header,nav{transition:background-color .4s}
.pill{font:700 14px 'Barlow Condensed',sans-serif;background:var(--r);color:#fff;border-radius:999px;padding:5px 12px;white-space:nowrap}
details summary{cursor:pointer;color:var(--dim);min-height:32px}
#sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
#sheet[hidden]{display:none}
.sh{background:var(--p);border-top:3px solid var(--r);border-radius:18px 18px 0 0;width:100%;max-width:720px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:inSheet .35s var(--ease)}
@keyframes inSheet{from{transform:translateY(100%)}}
.shl{display:grid;gap:10px}
.q.st1{background:#3a2e00;border-color:var(--y);color:var(--y)}
.q.st2{background:#3a0d0a;border-color:var(--r);color:#ff8a80}
.q.st3{opacity:.6}
.sup{padding:12px 0;border-top:1px solid var(--ln)}
.sup.miss{opacity:.55}
.supt{display:flex;gap:10px;align-items:flex-start}
.supt .q{cursor:pointer;min-height:36px;color:var(--ink)}
.ivr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:8px 0 0 22px}
.ivr .stp{width:172px;grid-template-columns:44px minmax(0,1fr) 44px}
.ivr input{border:0;background:transparent;text-align:center;font:700 19px 'Barlow Condensed',sans-serif;min-height:44px;width:100%;padding:0;color:var(--ink)}
.phase{margin-top:14px;padding:4px 12px 6px;border:1px solid var(--ln);border-radius:12px;transition:border-color .3s}
.phase.now{border-color:var(--y);box-shadow:inset 0 0 0 1px var(--y)}
.phh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px}
.ph{display:flex;gap:10px;font:700 14px 'Barlow Condensed',sans-serif;color:var(--dim);white-space:nowrap}
.ph.od{color:var(--r)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none;vertical-align:1px}
.lcs button{display:flex;align-items:center;text-align:left;line-height:1.15}
.lp{border-color:color-mix(in srgb,var(--cc) 55%,#3a3934);color:var(--ink);font-size:16px;min-height:50px}
.lp:hover{box-shadow:0 0 0 1px var(--cc)}
.lp.ask{border-style:dashed}
.whos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 12px}
.whos button{background:var(--p2);border:1.5px solid #3a3934;border-radius:999px;min-height:40px;padding:6px 14px;font:700 15px 'Barlow Condensed',sans-serif;color:var(--dim);cursor:pointer;transition:background-color .2s,color .2s}
.whos button[aria-pressed=true]{background:var(--y);color:#000;border-color:var(--y)}
.whos .lnk{background:none;border:0;color:var(--y);text-decoration:underline;padding:6px 4px}
.since{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:8px}
.sn{background:var(--p2);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.sn b{font:700 18px 'Barlow Condensed',sans-serif}
.lfc{margin-bottom:10px}
.lfc button{min-height:40px;font-size:15px}
.prb{min-height:42px;padding:6px 14px;font-size:16px;flex:none}
body.saver *,body.saver *::before,body.saver *::after{animation:none!important;transition:none!important}
.lw{display:flex;align-items:center;gap:8px}
.lw .li{flex:1}
.cmpsvg{width:min(80vw,260px);height:auto;display:block}
#rose{transition:transform .15s linear}
.mraw{overflow-wrap:anywhere;margin:-6px 0 12px;letter-spacing:.06em}
#light{position:fixed;inset:0;z-index:50;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding:28px;color:#8a8a8a;font:600 17px 'Barlow Condensed',sans-serif;cursor:pointer}
#light[hidden]{display:none}
#light.red{background:#b00000}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--y);color:#000;font:700 16px 'Barlow Condensed',sans-serif;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.cg{grid-template-columns:minmax(0,1fr)}.cg label{min-height:0}.kpis .big2{font-size:25px}.bar{grid-template-columns:7.2em minmax(0,1fr) 2.8em}}

:root{--ease:cubic-bezier(.2,.8,.2,1)}
.btn,.chips button,.seg button,nav button,.lxb,.stp button,.ch{transition:transform .15s var(--ease),background-color .2s,border-color .2s,color .2s,box-shadow .25s}
.btn,.chips button,nav button{position:relative;overflow:hidden}
.btn:active,.chips button:active,.seg button:active,.lxb:active,.stp button:active{transform:scale(.95)}
.btn:hover{box-shadow:0 0 0 1px var(--y),0 6px 18px rgba(255,212,0,.12)}
.btn.red:hover{box-shadow:0 6px 20px rgba(255,65,54,.3)}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.28;pointer-events:none;animation:rip .6s var(--ease) forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
nav{position:relative}
#ind{position:absolute;top:-1px;left:0;width:20%;height:3px;background:var(--y);border-radius:0 0 3px 3px;box-shadow:0 0 14px var(--y);transition:transform .45s var(--ease)}
nav svg{transition:transform .35s var(--ease)}
nav button[aria-current=page] svg{transform:translateY(-2px) scale(1.14)}
.li{transition:background-color .2s}
.li:active{background:rgba(255,255,255,.03)}
.box{transition:background-color .2s,border-color .2s}
.li.on .box{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(1.28)}}
.leaving{animation:out .3s var(--ease) forwards}
@keyframes out{to{opacity:0;transform:translateX(36px)}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes inU{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes inD{from{opacity:0;transform:translateY(-8px)}}
@keyframes grow{from{width:0}}
@keyframes arc{from{stroke-dasharray:0 100}}
@keyframes fade{from{opacity:0}}
#v.fr-r{animation:inR .38s var(--ease) both}
#v.fr-l{animation:inL .38s var(--ease) both}
.enter .card,.enter .chips{animation:inU .5s var(--ease) both}
.enter .card:nth-child(2){animation-delay:.05s}.enter .card:nth-child(3){animation-delay:.1s}.enter .card:nth-child(4){animation-delay:.15s}.enter .card:nth-child(5){animation-delay:.2s}.enter .card:nth-child(6){animation-delay:.25s}.enter .card:nth-child(n+7){animation-delay:.3s}

const G={
blackout:[
{t:'First hour',k:'Do these when the lights go out',b:`<ol>
<li><b>Start the blackout clock</b> on the Status tab.</li>
<li><b>Check if it's just you.</b> Look at neighbours and street lights, check your breaker panel, then the Hydro-Québec Info-pannes app. Report it: 1 800 790-2424.</li>
<li><b>Keep the fridge and freezer shut.</b></li>
<li><b>Unplug electronics</b> and appliances. Leave one lamp switched on so you know when power is back.</li>
<li><b>Fill the bathtub</b> and spare jugs while water pressure lasts. Tub water is for flushing.</li>
<li><b>Layer everyone up</b> and pick one small room to keep warm.</li>
<li><b>Save phone battery:</b> low-power mode, lower brightness, text instead of calling.</li>
<li><b>Turn on the radio</b> (Contacts tab has stations) and check on neighbours, especially older people.</li></ol>`},
{t:'Heat and carbon monoxide',k:'The two things most likely to hurt you',b:`<div class="warn"><b>Never</b> use a BBQ, camp stove, generator or charcoal indoors, in a garage or on a covered porch, even with the door open. Never sit in a car running in a garage.</div>
<ul><li>Only use heaters rated for indoor use (CSA), with a window cracked and a battery CO detector in the room.</li>
<li>Keep heaters at least 1 m from anything that can burn: blankets, curtains, furniture.</li>
<li>Close doors to unused rooms. Cover windows with blankets or plastic and block drafts under doors.</li>
<li>Wear hats, wool socks and layers. Sleep in one room, or in a tent set up indoors.</li>
<li>Eat and drink warm things. Your body makes heat from food.</li></ul>
<h3>Signs of CO poisoning</h3><p>Headache, dizziness, nausea, weakness, confusion, sleepiness. Several people feeling sick at once is a red flag.</p>
<div class="warn">CO alarm or symptoms: get everyone outside into fresh air right away, then call 911. Don't go back in.</div>`},
{t:'Water',k:'4 L per person per day',b:`<ul><li>Plan on 4 L per person per day for drinking, cooking and washing. For 4 people that's 16 L a day.</li>
<li>Backup water: the hot water tank, and the toilet tank (not the bowl, and not if you use tank cleaners).</li></ul>
<h3>Make water safe</h3><ul><li><b>Boil:</b> a rolling boil for at least 1 minute.</li>
<li><b>Bleach:</b> unscented household bleach (about 5.25%). 2 drops per litre of clear water, mix, cover, wait 30 minutes. It should smell slightly of chlorine. If not, add 2 more drops and wait 15 minutes.</li>
<li><b>Cloudy, or colder than 10°C:</b> double the bleach and wait 1 to 2 hours.</li>
<li><b>Tablets or filter:</b> follow the package.</li></ul><p class="sm dim">Boiling and bleach kill germs but don't remove chemicals or fuel.</p>`},
{t:'Food safety',k:'Fridge 4 h, freezer 24–48 h',b:`<ul><li>Keep the doors shut. A closed fridge keeps food cold about 4 hours. A full freezer keeps food frozen about 48 hours, a half-full one about 24.</li>
<li>Eat fridge food first, then freezer food, then your emergency stock.</li>
<li><b>Don't put food outside, even in winter.</b> Health Canada advises against it.</li>
<li>Keep a thermometer in the fridge. It should read 4°C or colder.</li>
<li>Spoiled food can look and smell fine. If in doubt, throw it out.</li></ul>`},
{t:'Frozen pipes',k:'If the house is going to freeze',b:`<ul><li>If the heat will be off long enough for the house to near freezing, shut off the water main and open the taps at the lowest point of the house to drain the pipes. Flush the toilets to empty the tanks.</li>
<li>Find the main valve <b>before</b> you need it.</li>
<li>Never thaw pipes with an open flame. Get an expert to thaw frozen pipes.</li>
<li>When you turn the water back on, open the taps to let the air out.</li></ul>`},
{t:'Generator rules',k:'Outdoors, 6 m away, exhaust pointed out',b:`<div class="warn">Generators make deadly carbon monoxide. Only run one outside, at least 6 m (20 ft) from the house, with the exhaust pointed away from doors, windows and vents. Never in a garage, even with the door open.</div>
<ul><li>Plug appliances into the generator with a heavy-duty outdoor extension cord.</li>
<li>Never plug a generator into a wall outlet. Connecting to house wiring needs a transfer switch installed by a qualified electrician.</li>
<li>Turn it off and let it cool before refuelling. Store fuel away from the house.</li>
<li>Keep a CO detector running inside.</li></ul>`},
{t:'Cold injuries',k:'Hypothermia and frostbite',b:`<h3>Hypothermia</h3><p>Signs: strong shivering, slurred speech, clumsiness, confusion, drowsiness. Shivering that <b>stops</b> while the person is still cold is a bad sign.</p>
<ul><li>Move them somewhere warmer and swap wet clothes for dry.</li><li>Warm the core first: chest, neck, head and groin, with blankets, or skin-to-skin in a sleeping bag.</li><li>If they're alert, give warm, sweet drinks. No alcohol.</li><li>Handle gently. Call 911 for confusion, drowsiness or no shivering.</li></ul>
<h3>Frostbite</h3><p>Signs: numb skin that looks white, grey or waxy, often on fingers, toes, ears and nose.</p>
<ul><li>Warm gently with body heat or lukewarm (not hot) water.</li><li>Don't rub it, and keep it away from heaters and fire: numb skin burns easily.</li><li>Don't rewarm it if it could freeze again. Get medical help.</li></ul>`},
{t:'Sanitation',k:'When toilets stop working',b:`<ul><li>No water pressure: flush by pouring a bucket of tub water straight into the bowl.</li>
<li>Backup toilet: a bucket lined with two heavy garbage bags, a scoop of kitty litter after each use. Seal the bag and store it outside, away from the house.</li>
<li>Wash hands or use sanitizer after the toilet and before food.</li><li>Keep trash bagged and sealed.</li></ul>`},
{t:'Comms plan',k:'When phones and internet go down',b:`<ul><li>Texts often get through when calls don't. Keep calls short.</li>
<li>Save battery: low-power mode, airplane mode when not needed, one phone on at a time.</li>
<li>A battery or crank radio is your news source if the internet is down.</li>
<li>Agree on a meeting spot near home and one out of the area, and write them down for everyone.</li>
<li>Signal for help: 3 whistle blasts, or SOS with a light (Tools tab).</li></ul>`},
{t:'When to leave',k:"Don't wait too long",b:`<p>Go to family, friends or a municipal warming centre if:</p>
<ul><li>The house keeps getting colder and you can't keep everyone warm.</li><li>A CO alarm goes off or anyone has CO symptoms (get out first, then call 911).</li><li>Someone needs power for medical equipment, or medications that must stay cold.</li><li>You run out of safe water or heating fuel.</li></ul>
<p>Take water, food, meds, IDs, cash, chargers and warm clothes. Shut the water main if the house may freeze, and leave a note saying where you went.</p>`},
{t:'When power returns',k:'Bring things back slowly',b:`<ul><li>Wait a few minutes, then plug in and turn on appliances one at a time.</li>
<li>Check fridge and freezer food before eating it. If in doubt, throw it out.</li>
<li>Check for leaks from frozen pipes.</li>
<li>Stop the blackout clock, then restock and recharge everything you used.</li></ul>`}],
winter:[
{t:'Ice storm',k:'Falling ice and downed lines',b:`<ul><li>Stay inside while ice builds up. Branches and ice fall without warning; stay away from trees and power lines.</li>
<li><b>Downed power line:</b> stay at least 10 m away, keep others and pets back, and call 911 and Hydro-Québec. Never touch the line or anything touching it, like a fence, car or puddle.</li>
<li>If a line falls on your car, stay inside and call 911. Only leave if the car is on fire: jump clear without touching the car and the ground at the same time, then shuffle away with small steps.</li>
<li>Clear ice and snow from vents and the furnace and dryer exhausts so CO doesn't build up indoors.</li></ul>`},
{t:'Stuck in your car',k:'Stay with the vehicle',b:`<ul><li>Stay in the car. It's shelter and easier for rescuers to spot. Don't walk off in a storm.</li>
<li>Run the engine only in short bursts (about 10 minutes every half hour) with a window open a crack, and keep the exhaust pipe clear of snow.</li>
<li>Turn on the dome light at night and tie something bright to the antenna or door.</li>
<li>Keep moving: clap, stretch, wiggle toes. Use the car blanket, and don't let everyone sleep at once.</li>
<li>Keep a winter car kit: shovel, sand or kitty litter for traction, booster cables, blanket, warm clothes, food, water, flashlight, phone charger.</li></ul>`},
{t:'Cold outdoors',k:'Shovelling and wind chill',b:`<ul><li>Shovelling is hard on the heart. Take breaks, push the snow instead of lifting, and stop if you feel chest pain or get short of breath.</li>
<li>Cover all skin when wind chill is severe. Exposed skin can freeze in minutes.</li>
<li>Dress in layers: a wicking base, a warm middle, a windproof shell. Wet clothes steal heat fast, so change them.</li>
<li>Keep paths salted and clear for emergency access.</li></ul>`},
{t:'Roof, snow and ice dams',k:'After a big dump',b:`<ul><li>Don't climb on the roof during an emergency. Falls are a top winter injury and hospitals may be stretched.</li>
<li>Keep gas meters, vents and exhausts clear of snow.</li>
<li>Watch ceilings for leaks or sagging after heavy snow and ice.</li></ul>`}],
nuclear:[
{t:'If you see the flash',k:'The first seconds',b:`<ul><li>Don't look at the flash.</li>
<li>Drop behind anything solid, face down, and cover your head. Stay down until the blast wave and shaking pass. It can take many seconds to reach you.</li>
<li>Then get inside the nearest building right away. You have about 10 minutes or more before fallout starts to arrive.</li></ul>
<div class="warn">Cars, tents, mobile homes and the outdoors do not protect you from fallout. Get inside a building.</div>`},
{t:'Get inside, stay inside, stay tuned',k:'Shelter for at least 24 hours',b:`<ul><li><b>Get inside:</b> brick or concrete is best. Go to the basement or the middle of the building, away from outer walls and the roof.</li>
<li><b>Stay inside</b> for at least 24 hours unless authorities tell you otherwise. Fallout is most dangerous in the first hours and drops quickly after that.</li>
<li>Stay where you are even if family members are somewhere else. Reunite later. Going outside early can expose you to a deadly dose.</li>
<li>Close windows and doors. Turn off fans, air exchangers and other appliances.</li>
<li>Bring pets inside.</li>
<li><b>Stay tuned:</b> battery and crank radios will still work. Phone, text and internet may be down.</li></ul>`},
{t:'Decontamination',k:'Get the dust off',b:`<ul><li>If you were outside after fallout arrived, take off your outer layer of clothing as you come in. That removes up to 90% of the radioactive material.</li>
<li>Take it off slowly so dust doesn't shake loose. Seal it in a plastic bag and put it away from people and pets.</li>
<li>Shower with soap and shampoo. <b>No conditioner:</b> it makes radioactive material stick to hair. Don't scrub or scratch your skin, and keep cuts covered.</li>
<li>No shower: wash your hands, face and any uncovered skin at a sink, or wipe with a wet cloth.</li>
<li>Gently blow your nose and wipe your eyelids, eyelashes and ears.</li>
<li>Put on clean clothes from a closed drawer or closet. Wipe down pets.</li></ul>`},
{t:'Food, water and medicine',k:'What is still safe',b:`<ul><li>Food and drinks in sealed cans, bottles and packages are safe. Wipe the outside before opening.</li>
<li>Tap water is safe for washing skin, hair and clothes. Follow official advice before drinking it.</li>
<li>Don't eat food that was outdoors or uncovered, or garden produce, until officials say it's safe.</li>
<li>Keep taking your regular medications.</li></ul>`},
{t:'Potassium iodide (KI)',k:'Only when told to',b:`<div class="warn">Only take KI pills if public health authorities tell you to.</div>
<ul><li>KI only protects the thyroid from radioactive iodine. It does nothing against other radioactive material.</li>
<li>It only helps in specific situations and timeframes, and can be harmful if used incorrectly.</li>
<li>Canada says you don't need KI in your kit unless you live near a nuclear power plant.</li></ul>`},
{t:'Radiation sickness signs',k:'When to get help',b:`<p>Nausea, vomiting, diarrhea, headache or fever in the hours or days after exposure can be early signs of radiation sickness.</p>
<ul><li>Follow official instructions on where to go for medical checks.</li><li>Treat injuries first. Keep the person warm, hydrated and resting.</li></ul>`},
{t:'Coming out',k:'After the first 24 hours',b:`<ul><li>Leave only when officials say it's safe, or if staying is more dangerous (fire, gas leak, collapse).</li>
<li>When you go out, wear a mask, cover your skin, and travel the way officials direct.</li>
<li>Keep bagged clothing outside your living space.</li></ul>`}],
cyber:[
{t:'Assume it lasts',k:'A grid attack is not a storm',b:`<ul><li>A cyberattack or war blackout can hit a wide area at once and take longer to fix. Plan for at least 7 days, ideally 14.</li>
<li>Expect banks, ATMs, card terminals, gas pumps, cell networks and internet to fail with the power.</li>
<li>Keep cash in small bills, a full gas tank and gas cans, paper copies of documents, and a printed contact list.</li>
<li>Refill prescriptions early. Pharmacies may close.</li></ul>`},
{t:'Trusted information only',k:'Rumours spread faster than facts',b:`<ul><li>Stick to official sources: Alert Ready emergency alerts on TV, radio and phones, government channels, Hydro-Québec and the news stations in the Contacts tab.</li>
<li>Expect fake messages. Never click links or give personal or bank details in texts or calls claiming to be the government, Hydro-Québec or your bank.</li>
<li>Check a claim against a second official source before acting on it or passing it on.</li>
<li>Write down official instructions and the time you heard them.</li></ul>`},
{t:'Air-raid or missile alert',k:'If an alert says take cover',b:`<ul><li>Go inside immediately, to the basement or lowest floor, away from windows.</li>
<li>Stay there until an official all-clear. Keep the radio on.</li>
<li>If it turns out to be nuclear, switch to the Nuclear guide: stay inside at least 24 hours.</li></ul>`},
{t:'Secure your home',k:'Keep a low profile',b:`<ul><li>Don't post about your supplies, generator or fuel online.</li>
<li>Keep doors locked. Light-proof the room you're using at night.</li>
<li>Know your neighbours. Agree how you'll check on each other and share what you can.</li>
<li>Keep a fire extinguisher handy. Candles, stoves and heaters raise the fire risk, and fire crews may be slow.</li></ul>`},
{t:'Comms when networks fail',k:'Low-tech beats no-tech',b:`<ul><li>Set check-in times and meeting spots in advance. If you can't reach each other, go to the meeting spot at the agreed time.</li>
<li>Walkie-talkies on one agreed channel for the household and neighbours.</li>
<li>Battery or crank radio for news.</li>
<li>Signal with Morse using a light, whistle or knocks (Tools tab). Three of anything, like blasts or flashes, means help.</li>
<li>Amateur (ham) radio reaches far, but transmitting in Canada needs a licence. Anyone can listen.</li></ul>`},
{t:'Health without a hospital',k:'Prevent what you cannot treat',b:`<ul><li>Hospitals may be overloaded. Skip risky jobs: chainsaws, ladders, roofs, ice.</li>
<li>Keep clean: wash hands, treat all drinking water, keep cuts clean and covered.</li>
<li>Stay warm, fed and hydrated. Cold and dehydration make every injury worse.</li>
<li>Keep a printed first aid guide in the kit.</li></ul>`},
{t:'When systems come back',k:'Expect scams and glitches',b:`<ul><li>Check bank and card statements for odd charges.</li>
<li>Update phones and computers, and change important passwords once services are stable.</li>
<li>Expect scams posing as relief payments, Hydro-Québec refunds or bank checks.</li>
<li>Restock the kit and note what ran out first.</li></ul>`}],
fire:[
{t:'House fire',k:'Get out, stay out',b:`<div class="warn">Get everyone out, then call 911 from outside. Never go back in for anything.</div>
<ul><li>Crawl low under smoke, where the air is cleaner.</li>
<li>Feel doors with the back of your hand before opening. If it's hot, use another way out.</li>
<li>Close doors behind you to slow the fire.</li>
<li>Meet at one spot outside that everyone knows, so you can count heads.</li>
<li>Clothes on fire: stop, drop and roll, covering your face.</li>
<li>Trapped: close the door, block gaps with wet towels, call 911 and signal from the window.</li></ul>`},
{t:'Fire extinguisher',k:'P.A.S.S.',b:`<ul><li>Only fight a small fire, with your back to a clear exit. If it's not out in a few seconds, leave.</li>
<li><b>Pull</b> the pin. <b>Aim</b> at the base of the fire. <b>Squeeze</b> the handle. <b>Sweep</b> side to side.</li>
<li>Grease fire on the stove: turn off the heat and slide a lid over the pan. <b>Never use water</b> on a grease fire.</li></ul>`},
{t:'Gas leak',k:'Rotten egg smell',b:`<div class="warn">Natural gas smells like rotten eggs. Leave right away and call 911 from outside. If 911 isn't working, call Énergir's emergency line: 1 800 361-8003.</div>
<ul><li>Don't make sparks: no light switches, phones, lighters or matches near the leak, and no smoking.</li>
<li>If it doesn't slow your exit, open doors and windows on the way out.</li>
<li>Don't go back in until emergency crews say it's safe.</li>
<li>Only shut the gas valve if there's a leak or officials tell you to. A technician has to turn it back on.</li></ul>`},
{t:'Candles and heaters',k:'The top blackout fire causes',b:`<ul><li>Use flashlights and lanterns before candles. If you must use candles, put them in sturdy holders away from anything that burns, and never leave them unattended or near kids and pets.</li>
<li>Keep heaters at least 1 m from blankets, curtains and furniture.</li>
<li>Test smoke alarms. Keep spare batteries.</li></ul>`}],
aid:[
{t:'Check, call, care',k:'The first 30 seconds',b:`<ol><li><b>Check</b> the scene is safe for you: fire, gas, traffic, downed lines.</li>
<li><b>Call</b> 911, or have someone call. Put the phone on speaker; the dispatcher will coach you.</li>
<li><b>Care</b> for the most serious problem first: not breathing, severe bleeding, choking.</li></ol>
<p class="sm dim">Take a Red Cross or St. John Ambulance first aid course. Practice beats reading.</p>`},
{t:'CPR',k:'Not breathing normally',b:`<div class="warn">Unresponsive and not breathing normally: call 911 and start CPR right away. Send someone for an AED (defibrillator) if one is near.</div>
<ul><li>Put the heel of one hand in the centre of the chest, other hand on top.</li>
<li>Push hard and fast: at least 5 cm deep, 100 to 120 pushes a minute. Let the chest come all the way back up.</li>
<li>Not trained in rescue breaths? Do hands-only CPR: keep pushing without stopping.</li>
<li>Switch with someone every 2 minutes if you can. Don't stop until help arrives or the person starts breathing.</li></ul>`},
{t:'Choking',k:'Can\'t breathe, cough or speak',b:`<ul><li>If they can cough, let them keep coughing.</li>
<li>If they can't: give 5 firm back blows between the shoulder blades, then 5 abdominal thrusts (fist just above the belly button, pull in and up). Repeat until it clears.</li>
<li>If they become unresponsive, call 911 and start CPR.</li>
<li>Choking alone: thrust your belly against the back of a chair.</li></ul>`},
{t:'Severe bleeding',k:'Pressure, pressure, pressure',b:`<ul><li>Press hard on the wound with a clean cloth or gauze, and keep pressing. Don't lift it to check.</li>
<li>If blood soaks through, add more on top and keep pressing.</li>
<li>Life-threatening bleeding from an arm or leg that won't stop: a tourniquet 5 to 7 cm above the wound, tightened until bleeding stops. Note the time.</li>
<li>Call 911. Keep the person lying down and warm.</li></ul>`},
{t:'Burns',k:'Cool it down',b:`<ul><li>Cool the burn under cool running water for at least 10 minutes.</li>
<li>Take off rings and tight things before it swells. Don't pull off clothing stuck to the burn.</li>
<li>No ice, butter or creams. Cover loosely with a clean, non-stick dressing or plastic wrap.</li>
<li>Call 911 for large burns, burns to the face, hands, groin or airway, chemical or electrical burns.</li></ul>`},
{t:'Heart attack and stroke',k:'Call 911 fast',b:`<h3>Heart attack</h3><p>Chest pain or pressure, pain spreading to the arm, jaw or back, shortness of breath, cold sweat, nausea. Call 911, keep them resting. The dispatcher may tell you to have them chew an aspirin.</p>
<h3>Stroke: think FAST</h3><ul><li><b>F</b>ace drooping</li><li><b>A</b>rm weakness</li><li><b>S</b>peech slurred or strange</li><li><b>T</b>ime to call 911, and note when it started.</li></ul>`},
{t:'Broken bones and sprains',k:'Keep it still',b:`<ul><li>Don't straighten a broken bone. Support it in the position you found it with padding, a splint (board, rolled magazine) or a sling.</li>
<li>Check fingers or toes stay warm and pink after splinting.</li>
<li>Sprains: rest, ice wrapped in cloth for 20 minutes at a time, light compression, raise it.</li>
<li>Suspected head, neck or back injury: don't move them unless they're in danger. Call 911.</li></ul>`},
{t:'Shock',k:'Pale, cold, clammy',b:`<ul><li>Signs: pale or grey skin, cold sweat, fast weak pulse, fast breathing, confusion, after injury or bleeding.</li>
<li>Call 911. Have them lie down, treat the cause (like bleeding), keep them warm and calm.</li>
<li>Don't give food or drink.</li></ul>`},
{t:'Allergic reaction',k:'Use the EpiPen',b:`<ul><li>Signs of a severe reaction: swelling of the face or throat, trouble breathing, hives, dizziness.</li>
<li>If they have an epinephrine auto-injector, use it in the outer thigh right away, then call 911.</li>
<li>A second dose may be needed after 5 to 15 minutes if symptoms don't improve.</li></ul>`}],
skills:[
{t:'Water from snow and outdoors',k:'Treat everything',b:`<ul><li>Melt snow or ice in a pot, then boil or treat it. Don't eat snow: it chills your body and costs heat.</li>
<li>Rain, rivers and pools: let it settle, pour through a clean cloth, then boil or treat.</li>
<li>Never drink water that smells of fuel or chemicals. Treating won't fix that.</li></ul>`},
{t:'Cooking with less fuel',k:'Make your propane last',b:`<ul><li>Cook outside only. Use lids, and cook one-pot meals.</li>
<li>Heat-retention trick: bring rice or pasta to a boil for a few minutes, then wrap the covered pot in blankets or put it in a cooler. It keeps cooking without fuel.</li>
<li>Canned food can be eaten cold. Save hot food for morale and warmth.</li></ul>`},
{t:'Rationing',k:'Water first, then calories',b:`<ul><li>Drink what you need. Ration activity and sweat, not water.</li>
<li>Eat perishables first, then the freezer, then the stock.</li>
<li>Aim for about 2,000 kcal a person a day. Fats and peanut butter give the most energy per bite.</li>
<li>Track what you have on the Status tab, and recount daily.</li></ul>`},
{t:'Navigation without GPS',k:'Sun, stars, paper',b:`<ul><li>Keep a paper map of the area with your meeting spots marked.</li>
<li>The sun rises roughly in the east and sets in the west. At midday it's due south here.</li>
<li>At night, find the Big Dipper. The two stars at the end of its cup point to the North Star.</li>
<li>Pick a landmark in the direction you want to go, walk to it, pick the next one.</li></ul>`},
{t:'Signalling for help',k:'Be seen and heard',b:`<ul><li>Three of anything means help: 3 whistle blasts, 3 flashes, 3 fires or piles.</li>
<li>SOS in Morse: ··· ––– ··· (Tools tab has a light and sound version).</li>
<li>Bright cloth on a car antenna, a door or a window.</li>
<li>Flash sunlight with a mirror or phone screen toward planes or searchers.</li></ul>`},
{t:'Morale and mental health',k:'Keep the family steady',b:`<ul><li>Keep a routine: set times for meals, sleep and check-ins.</li>
<li>Give everyone a job. Feeling useful beats feeling helpless.</li>
<li>Limit news to scheduled updates. Constant rumours wear people down.</li>
<li>Talk about worries. Kids need simple, honest explanations and play.</li>
<li>Sleep and warmth matter more than you think. Take turns resting.</li></ul>`},
{t:'Evacuating',k:'When you have to go',b:`<ul><li>Leave when officials tell you to. Use the routes they give; shortcuts may be blocked.</li>
<li>Grab the go-bag: water, food, meds, IDs, cash, chargers, warm clothes, radio, flashlight.</li>
<li>Bring pets with food and a carrier.</li>
<li>Lock the house, leave a note saying where you went, and tell your out-of-area contact.</li>
<li>Only turn off utilities if officials tell you to, or if there's a gas leak.</li></ul>`},
{t:'Pets',k:'Plan for them too',b:`<ul><li>Pets need about 30 mL of water per kg of body weight each day.</li>
<li>Keep a week of food, any meds, a leash and a carrier.</li>
<li>Keep them inside during storms, smoke or fallout.</li></ul>`}],
other:[
{t:'Flood',k:'Never walk or drive through it',b:`<ul><li>Move valuables and supplies upstairs. Evacuate if told to.</li>
<li>Never walk or drive through floodwater. Fast water only ankle-deep can knock you down, and a little water can float a car.</li>
<li>Only shut off the electricity if the area around the panel is dry and safe.</li>
<li>After: don't use flooded appliances until checked, and follow any boil-water advisory.</li></ul>`},
{t:'Heat wave and summer outage',k:'Heat kills quietly',b:`<ul><li>Drink water often, even before you're thirsty. Close blinds by day, open windows at night.</li>
<li>Stay on the lowest floor. Cool showers or wet cloths help.</li>
<li><b>Heat exhaustion:</b> heavy sweating, dizziness, nausea, headache. Move to a cool place, drink water, rest.</li>
<li><b>Heat stroke:</b> confusion, very hot skin, fainting. Call 911 and cool them fast with water and fanning.</li>
<li>Check on older neighbours twice a day.</li></ul>`},
{t:'Earthquake',k:'Drop, cover, hold on',b:`<ul><li><b>Drop</b> to your hands and knees, take <b>cover</b> under a sturdy table, <b>hold on</b> until the shaking stops.</li>
<li>Stay away from windows and tall furniture. Don't run outside during shaking.</li>
<li>After: expect aftershocks. Check for gas leaks, fires and injuries.</li></ul>`},
{t:'Chemical spill or toxic smoke',k:'Shelter in place',b:`<ul><li>Get inside right away. Close and lock windows and doors.</li>
<li>Turn off the furnace, air exchanger and exhaust fans, and close the fireplace damper.</li>
<li>Go to an inside room above ground with few windows. Many chemicals sink, so avoid the basement.</li>
<li>Keep the radio on and stay put until officials give the all-clear.</li></ul>`},
{t:'Wildfire smoke',k:'Protect your lungs',b:`<ul><li>Keep windows and doors closed. Set the air exchanger to recirculate if you can.</li>
<li>A well-fitted N95 mask helps outdoors. Cloth masks don't.</li>
<li>Limit hard activity outside. Watch older people, kids and anyone with asthma.</li></ul>`},
{t:'Tornado or violent wind',k:'Lowest, smallest, innermost',b:`<ul><li>Go to the basement, or an inside room on the lowest floor, away from windows.</li>
<li>Cover your head and neck. A mattress or blankets over you helps.</li>
<li>In a car with no shelter nearby: buckle up, get below the windows and cover your head.</li></ul>`}]

if(!S.init){C.forEach((c,ci)=>c.i.forEach((it,ii)=>{if(it[3])S.done[ci+'-'+ii]=1}));S.init=1}

function tref(){let p='';[210,330,90].forEach(c=>{const a1=(c-30)*Math.PI/180,a2=(c+30)*Math.PI/180,pt=(r,a)=>`${(12+r*Math.cos(a)).toFixed(2)} ${(12+r*Math.sin(a)).toFixed(2)}`;p+=`M${pt(3.4,a1)}L${pt(11,a1)}A11 11 0 0 1 ${pt(11,a2)}L${pt(3.4,a2)}A3.4 3.4 0 0 0 ${pt(3.4,a1)}Z`});return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p}" fill="#000"/><circle cx="12" cy="12" r="2.2" fill="#000"/></svg>`}

function gauge(p){
  let t='';
  for(let i=0;i<=20;i++){const a=Math.PI*(1+i/20),mj=i%5===0,r2=mj?124:117;t+=`<line x1="${(120+110*Math.cos(a)).toFixed(1)}" y1="${(128+110*Math.sin(a)).toFixed(1)}" x2="${(120+r2*Math.cos(a)).toFixed(1)}" y2="${(128+r2*Math.sin(a)).toFixed(1)}" stroke="${mj?'#ffd400':'#4a4943'}" stroke-width="${mj?3:2}"/>`}
  const col=p<34?'#ff4136':p<75?'#ffd400':'#3ddc84',arc='M24 128A96 96 0 0 1 216 128';
  return `<svg viewBox="0 0 240 140" role="img" aria-label="Readiness ${p} percent">${t}<path d="${arc}" pathLength="100" fill="none" stroke="#2e2d29" stroke-width="20"/><path d="${arc}" pathLength="100" fill="none" stroke="${col}" class="arc" stroke-width="20" stroke-dasharray="${Math.max(p,.5)} 100"/><text x="120" y="120" text-anchor="middle" fill="#f1efe6" font-family="'Black Ops One',Impact,sans-serif" font-size="48">${p}%</text></svg>`;
}
const catBars=()=>C.map((c,ci)=>{const its=ALL.filter(x=>x.ci===ci),d=its.filter(x=>S.done[x.id]).length;return `<div class="bar" style="--d:${ci*45}ms"><span>${c.n}</span><span class="trk"><i style="width:${d/its.length*100}%;background:${c.c}"></i></span><span>${d}/${its.length}</span></div>`}).join('');

function itemRow(x,cat){

}
const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400);return (d?d+'d ':'')+pad(Math.floor(s%86400/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};

function boLive(){
  const e=Date.now()-S.bo,eh=e/36e5;
  const food=[['Fridge, door closed',4],['Half-full freezer',24],['Full freezer',48]].map(([n,h])=>{const r=eh/h,col=r<.75?'var(--g)':r<1?'var(--y)':'var(--r)',txt=r<.75?hrs(h-eh)+' left':r<1?hrs(h-eh)+' left. Check the temperature':'Past the limit. If in doubt, throw it out';return `<div><div class="fr"><b>${n}</b><span>${txt}</span></div><span class="trk"><i style="width:${Math.min(r,1)*100}%;background:${col}"></i></span></div>`}).join('');

}

const PR=[['alarms','Test smoke and CO alarms',30],['charge','Charge power banks, radio and headlamps',30],['meds','Check meds and first aid expiry dates',90],['drill','Run a test drill (Test mode)',90],['water','Rotate stored water',180],['food','Check food expiry dates',180],['plan','Update contacts and meeting spots',180],['car','Check the car kit, tires and wipers',365]];

function setCard(){return `<section class="card"><h2>Settings and backup</h2>
<div class="num"><span><b>People in the household</b></span><div class="stp" style="width:150px"><button data-act="pp" data-d="-1" aria-label="Fewer people">−</button><span id="pv">${S.people}</span><button data-act="pp" data-d="1" aria-label="More people">+</button></div></div>

function tr(s){
  const t=(s||'').trim();
  if(!t)return{dir:'Waiting for input',out:'',morse:''};
  if(/^[.\-·•–—_−\s\/]+$/.test(t)){const n=t.replace(/[·•]/g,'.').replace(/[–—_−]/g,'-');const out=n.split(/\s*\/\s*|\s{3,}/).map(w=>w.trim().split(/\s+/).filter(Boolean).map(c=>R[c]||'?').join('')).join(' ');return{dir:'Morse → text',out,morse:n}}
  const morse=t.toUpperCase().split(/\s+/).map(w=>[...w].map(ch=>M[ch]).filter(Boolean).join(' ')).filter(Boolean).join(' / ');
  return{dir:'Text → Morse',out:morse,morse};
}

function seqOf(m){const q=[],ws=m.trim().split(/\s*\/\s*/);ws.forEach((w,wi)=>{const ls=w.trim().split(/\s+/).map(l=>l.replace(/[^.\-]/g,'')).filter(Boolean);ls.forEach((l,li)=>{[...l].forEach((s,si)=>{q.push([1,s==='-'?3:1]);if(si<l.length-1)q.push([0,1])});if(li<ls.length-1)q.push([0,3])});if(wi<ws.length-1)q.push([0,7])});q.push([0,7]);return q}

function calc(){

const TICK=8;
const Dec=()=>({st:0,t0:0,cnt:0,u:80,ev:[],ph:0,cur:'',raw:'',text:''});

const clampU=u=>Math.min(600,Math.max(25,u));
function estU(D){

}

    if(D.t0){D.ev.push([D.st,t-D.t0]);if(D.ev.length>4000)D.ev.splice(0,1000)}
    D.st=sig?1:0;D.t0=t;D.ph=0;decodeAll(D,0);return true}

}

const mic={on:false,sens:14,floor:-95,lvl:-120,msg:'',stream:null,an:null,src:null,buf:null,timer:null,b0:0,b1:0,k:0};
function micUI(){
  const a=$('mtx');if(!a)return;a.textContent=(dec.text+(dec.cur?' …':''))||'—';$('mraw').textContent=dec.raw+dec.cur;
  const b=$('mbtn');b.textContent=mic.on?'Stop listening':'Start listening';b.className='btn wide'+(mic.on?' red':'');
  const span=30,lv=Math.max(0,Math.min(1,(mic.lvl-mic.floor)/span));$('mlv').style.width=(mic.on?lv*100:0)+'%';$('mlv').style.background=mic.on&&dec.st?'var(--g)':'var(--y)';$('mth').style.left=Math.min(100,mic.sens/span*100)+'%';
  $('mmsg').textContent=mic.msg;

  mic.an.getFloatFrequencyData(mic.buf);
  let mx=-200;for(let i=mic.b0;i<=mic.b1;i++)if(mic.buf[i]>mx)mx=mic.buf[i];
  mic.lvl=mx;
  if(!dec.st)mic.floor+= (mx-mic.floor)*(mx<mic.floor?.3:.004);

async function micStart(){

  if(!actx()){mic.msg='Audio is not available here.';micUI();return}
  try{mic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){mic.msg="Microphone blocked. Allow mic access when asked, or use the offline app file in Chrome.";micUI();return}

  if(a==='tplus'){const t=tById(b.dataset.id);if(!t)return;if(t.run)t.e+=3e5;else t.rem+=3e5;save();tRefresh();return}
  if(a==='tdel'||a==='tdone'){S.timers=S.timers.filter(t=>t.id!==b.dataset.id);save();tab==='status'?render():tRefresh();return}
  if(a==='tagain'){const t=tById(b.dataset.id);if(!t)return;t.e=Date.now()+t.d*1000;t.run=true;t.done=false;actx();save();tRefresh();return}
  if(a==='siren'){sirenToggle();if(siren)logAdd('Siren sounded');const sb=$('sirb');if(sb)sb.textContent=siren?'Stop siren':'Siren';return}

  if(a==='sosb'){beepSeq(seqOf('... --- ...'));logAdd('SOS beeps sent');return}
  if(a==='cvset'){const k=b.dataset.k,v=b.dataset.v;S.cv[k]=isNaN(+v)?v:+v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));calcOut();return}
  if(a==='cmpstart'){cmpStart();return}

function norm(){S.lat=S.lat==null||!isFinite(+S.lat)?null:Math.min(66,Math.max(-66,+S.lat));S.lon=S.lon==null||!isFinite(+S.lon)?null:Math.min(180,Math.max(-180,+S.lon));const num=(v,d,lo,hi)=>{v=+v;return isFinite(v)?Math.min(hi,Math.max(lo,v)):d};const pick=(v,list,d)=>list.includes(v)?v:d;
S.people=Math.round(num(S.people,4,1,20));S.water=num(S.water,112,0,1e5);S.food=num(S.food,7,0,1e4);S.bo=S.bo==null?null:(isFinite(+S.bo)&&+S.bo>0?+S.bo:null);

if(Array.isArray(S.log))S.log=S.log.filter(e=>e&&typeof e==='object').slice(0,500).map(e=>({t:num(e.t,Date.now(),0,1e14),x:String(e.x||'').slice(0,240),k:e.k==='em'?'em':'',c:String(e.c||'sys').replace(/[^\w]/g,'').slice(0,20),...(e.inv?{inv:String(e.inv).replace(/[^\w-]/g,'').slice(0,40)}:{})}));

if(!S.pr||typeof S.pr!=='object')S.pr={};if(!S.inv||typeof S.inv!=='object')S.inv={};if(!S.low||typeof S.low!=='object')S.low={};if(!S.acts||typeof S.acts!=='object')S.acts={};if(S.bo&&S.mode!=='lock'){S.mode='lock';S.scen=S.scen||'blackout'}if(!S.bo)S.mode='prep';S.cv=Object.assign({},CVD,S.cv||{});['timers','log','custom'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});buildAll()}
